[package]
name = "bb_core"
description = "Bench Buddy's shared pieces: arcdps log reading, the live record, cast matching, downloads"
edition = "2021"
version = "0.1.0"

[dependencies]
serde_json = { workspace = true }
miniz_oxide = "0.8"
ureq = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_System_SystemInformation"] }
